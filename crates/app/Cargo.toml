[package]
name = "jsonquery_gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jsonquery_gui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.16"
eframe = "0.36.1"
egui = "0.36.1"
egui_extras = "0.36.1"
jsonquery-core = { path = "../core" }
jsonquery-query = { path = "../query" }
# SHA-256 of what the workspace keeps, and the random bytes of an item's id: the
# crate that the TLS stack of `ureq` is already built on.
ring = "0.17.14"
rfd = "0.17.2"
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "2.0.20"
ureq = "3.3.0"

[build-dependencies]
winresource = "0.1.31"
