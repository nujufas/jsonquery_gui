[package]
name = "jsonquery_gui"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "jsonquery_gui"
path = "src/main.rs"

[features]
default = ["mcp"]
# The MCP server: a button in the status bar that lets an AI assistant work with what
# the app has open. In every build but those with "_nomcp" in their name, which are
# built with --no-default-features.
mcp = ["dep:jsonquery-mcp"]

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.16"
eframe = "0.36.1"
egui = "0.36.1"
egui_extras = "0.36.1"
jsonquery-core = { path = "../core" }
jsonquery-query = { path = "../query" }
jsonquery-mcp = { path = "../mcp", optional = true }
# SHA-256 of what the workspace keeps, and the random bytes of an item's id: the
# crate that the TLS stack of `ureq` is already built on.
ring = "0.17.14"
rfd = "0.17.2"
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "2.0.20"
ureq = "3.3.0"

[build-dependencies]
winresource = "0.1.31"
