[package]
name = "jsonquery-query"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.16"
jaq-core = "3.1.1"
# jaq-json 2.0.3 with changes of ours: third_party/jaq-json/JSONQUERY.md says which.
jaq-json = { version = "2.0.3", path = "../../third_party/jaq-json" }
jaq-std = "3.0.3"
jmespath = { version = "0.5.0", features = ["sync"] }
# JSON Schema validation (the Tools window's "Validate Schema"). Without its
# default features it can neither fetch a `$ref` over HTTP nor read one from a
# file: a schema pasted into a viewer should not be able to do either.
jsonschema = { version = "0.56", default-features = false, features = ["arbitrary-precision"] }
jsonpath-rust = "1.0.10"
# The patterns Create Schema looks for in strings (the crate the validator is built on).
regex = "1.13.1"
jsonquery-core = { path = "../core" }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "2.0.20"
