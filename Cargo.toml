[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/query",
    "crates/app",
]
# jaq-json with a few changes (see its JSONQUERY.md): a path dependency of crates/query, but
# not a member, so that fmt, clippy and the tests of the workspace are not run on it.
exclude = ["third_party/jaq-json"]

[workspace.package]
version = "0.5.1"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
