name: jsonquery-gui
title: jsonquery
base: core24
version: '0.4.2'
summary: Browse and query large JSON files with jq, JSONPath, JMESPath & Pointer
description: |
  jsonquery is a native desktop GUI for browsing and querying large JSON
  files. It streams and virtualizes big files instead of loading them
  whole, and lets you query with jq, JSON Pointer, JSONPath, or JMESPath --
  pick a query engine (or leave it on auto-detect) and see results update
  live in a tree or text view.

  Open files by drag-and-drop, file picker, pasted text, or URL. The query
  box can autocomplete functions and your document's own keys, colour-codes
  each step of what you type, and a built-in tutorial teaches all four
  query languages with examples you can run.
grade: stable
confinement: strict
license: MIT
icon: assets/icons/icon-256.png
contact: https://github.com/nujufas/jsonquery_gui/issues
issues: https://github.com/nujufas/jsonquery_gui/issues
source-code: https://github.com/nujufas/jsonquery_gui
website: https://github.com/nujufas/jsonquery_gui

platforms:
  amd64:
  arm64:
    # Built natively on an arm64 host, or cross-built from amd64 (see the
    # cross branch in override-build below).
    build-on: [amd64, arm64]
    build-for: [arm64]

apps:
  jsonquery-gui:
    command: bin/jsonquery_gui
    extensions: [gnome]
    common-id: io.github.nujufas.jsonquery_gui
    plugs:
      - network
      # Strict confinement denies every path outside the snap, so without
      # these a path typed or pasted into the Source field or dropped on the
      # window fails with "Permission denied". `home` covers non-hidden files
      # under $HOME and auto-connects on desktops. The "…" picker needs
      # neither, it returns document-portal paths.
      - home
      # /media, /run/media and /mnt. Not auto-connected by default: users run
      # `snap connect jsonquery-gui:removable-media` until the Store approves
      # auto-connection. The plug itself passed automated review (revs 5, 6).
      - removable-media

parts:
  jsonquery-gui:
    # Not using `plugin: rust`: it fetches its toolchain via the `rustup`
    # *snap*, and snapcraft's `gnome` extension composes its own PATH
    # (`.../gnome-46-2404-sdk/current/usr/bin${PATH:+:$PATH}`) against a
    # minimal baseline that excludes /snap/bin, so the rust plugin's own
    # environment-validation step can't find that rustup and always fails
    # with "'rustup' not found" -- reproducible regardless of build backend.
    # Installing Rust ourselves via rustup.sh sidesteps the snap entirely.
    plugin: nil
    source: .
    build-packages:
      - curl
      - ca-certificates
      - gcc
      - pkg-config
      - on amd64 to arm64:
          - gcc-aarch64-linux-gnu
          # Only a *Recommends* of the cross gcc, which snapcraft skips; without
          # it gcc falls back to the host's amd64 /usr/include and fails.
          - libc6-dev-arm64-cross
    override-build: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
          sh -s -- -y --default-toolchain stable --profile minimal
      . "$HOME/.cargo/env"
      echo "build-on=$CRAFT_ARCH_BUILD_ON build-for=$CRAFT_ARCH_BUILD_FOR"
      if [ "$CRAFT_ARCH_BUILD_ON" = "$CRAFT_ARCH_BUILD_FOR" ]; then
          cargo build --release -p jsonquery_gui
          BIN=target/release/jsonquery_gui
      else
          # amd64 -> arm64 cross-build. The binary links only libc/libm/
          # libgcc_s; X11, Wayland, xkbcommon and GL are dlopen'd at run
          # time from the gnome content snap, so all this needs is a cross
          # C compiler/linker (for the `ring` crate and the final link).
          rustup target add aarch64-unknown-linux-gnu
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          cargo build --release --target aarch64-unknown-linux-gnu -p jsonquery_gui
          BIN=target/aarch64-unknown-linux-gnu/release/jsonquery_gui
      fi
      install -Dm755 "$BIN" "$CRAFT_PART_INSTALL/bin/jsonquery_gui"
